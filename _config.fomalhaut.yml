snackbar:
  enable: false
  position: top-right
  bg_light: var(--theme-color) # The background color of Toast Notification in light mode
  bg_dark: "#191919" # The background color of Toast Notification in dark mode

# https://instant.page/
# prefetch (預加載)
instantpage: true

# https://github.com/vinta/pangu.js
