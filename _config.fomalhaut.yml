  global-font-size: 15.5px
  code-font-size: 14.7px
  # -apple-system, BlinkMacSystemFont, "Segoe UI" , "Helvetica Neue" , Lato, Roboto, "PingFang SC" , "Microsoft JhengHei" , "Microsoft YaHei" , sans-serif
  # Wenkai, consolas, -apple-system, 'Quicksand', 'Nimbus Roman No9 L', 'PingFang SC', 'Hiragino Sans GB', 'Noto Serif SC', 'Microsoft Yahei', 'WenQuanYi Micro Hei', 'ST Heiti', sans-serif;
  font-family: var(--global-font), -apple-system, 'Quicksand', 'Nimbus Roman No9 L', 'PingFang SC', 'Hiragino Sans GB', 'Noto Serif SC', 'Microsoft Yahei', 'WenQuanYi Micro Hei', 'ST Heiti', sans-serif;
  # JetBrainsMono, "Microsoft YaHei", Menlo, "PingFang SC", "Microsoft JhengHei", sans-serif
  # 可用值：JetBrainsMono / FiraCode / SourceCodePro（见 _custom/custom.css 的「字体引入」一节）
  # 首位改成 var(--code-font) 变量，值由美化设置「代码块字体」写入（localStorage.codeFont / source/js/fomal.js 的 setCodeFont），
  # 变量没设置过时回落 JetBrainsMono；第二位保留 var(--global-font)，让 JetBrains Mono / Fira Code 这类不含中文的等宽字体
  # 里的中文注释跟随正文字体，而不是掉成怪字体。
  code-font-family: var(--code-font, JetBrainsMono), var(--global-font), "Microsoft YaHei", Menlo, "PingFang SC", "Microsoft JhengHei", sans-serif

