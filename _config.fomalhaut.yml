lazyload:
  enable: true
  field: site # site/post
  placeholder: # /assets/load.gif
  blur: true

# PWA
# See https://github.com/JLHwung/hexo-offline
# ---------------
pwa:
  enable: false
  manifest: /manifest.json
  theme_color: var(--theme-color)
  apple_touch_icon: /assets/gulp/siteicon/128.png
  favicon_32_32: /assets/gulp/siteicon/32.png
  favicon_16_16: /assets/gulp/siteicon/16.png
  mask_icon: /assets/gulp/siteicon/128.png

# Open graph meta tags
# https://developers.facebook.com/docs/sharing/webmasters/
Open_Graph_meta: true

# Add the vendor prefixes to ensure compatibility
css_prefix: true

# Inject
# Insert the code to head (before '</head>' tag) and the bottom (before '</body>' tag)
# 插入代码到头部 </head> 之前 和 底部 </body> 之前
inject:
  head:
    # - <meta name="referrer" content="no-referrer"/> # 禁止referrer：解决Vika图床出现403问题
