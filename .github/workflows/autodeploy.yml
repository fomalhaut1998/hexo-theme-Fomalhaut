name: 自动部署
# 当有改动推送到 main 分支 / 发布 Release / 在 Actions 页面手动触发时，启动 Action
on:
  push:
    branches:
      - main
      #2020年10月后github新建仓库默认分支改为main，注意更改
  release:
    types:
      - published
  workflow_dispatch: # 允许在 Actions 页面手动运行（Actions → 自动部署 → Run workflow）

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查分支
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 安装 Hexo
        run: |
          export TZ='Asia/Shanghai'
          npm install hexo-cli -g

      - name: 缓存 Hexo
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{runner.OS}}-node22-${{hashFiles('**/package-lock.json')}}

      - name: 安装依赖
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm install gulp-cli -g #全局安装gulp
          npm ci

      - name: 生成静态文件
        run: |
          hexo clean
          # hexo bangumi -u #bilibili番剧更新
          hexo generate
          gulp

      - name: 写入部署时间戳
        # 小站资讯卡「更新」项同源读取的产物：本次部署的构建时刻（UTC ISO8601）。
        # 页面拿到后换算成「N 分钟前」，不再依赖 GitHub API（省掉 60 次/小时的未认证限流）。
        # 必须放在 gulp 之后：gulp 会处理 public/，写早了会被覆盖。
        run: |
          printf '{"at":"%s","sha":"%s","run":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.sha }}" "${{ github.run_id }}" > public/deploy.json
          cat public/deploy.json

      - name: 部署到Github
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GH_PAT }}
          repository-name: yourname/yourname.github.io
          branch: main
          folder: public
          commit-message: '${{ github.event.head_commit.message || github.sha }} Updated By Github Actions'

      - name: 上传至缤纷云对象存储
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          # AWS CLI 自身对单个请求的重试（默认 3 次 / legacy 模式）
          AWS_MAX_ATTEMPTS: '10'
          AWS_RETRY_MODE: 'adaptive'
        run: |
          # s3.bitiful.net 从海外 runner 走，偶发一次 TLS 中断就会让整步 exit 1。
          # sync 是幂等的（只传有差异的文件），所以整体重试一轮的代价很小。
          for i in 1 2 3; do
            if aws s3 sync --endpoint-url https://s3.bitiful.net ./public s3://your-bucket-name \
              --no-progress --cli-connect-timeout 30 --cli-read-timeout 120; then
              echo "✅ 第 $i 次同步成功"
              exit 0
            fi
            echo "::warning::第 $i 次上传缤纷云失败，15 秒后重试"
            sleep 15
          done
          echo "::error::连续 3 次上传缤纷云都失败，请查看上面的 upload failed 行"
          exit 1
