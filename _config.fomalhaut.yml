# Main menu navigation (導航目錄)
# see https://butterfly.js.org/posts/4aa8abbe/#導航菜單
# --------------------------------------

menu:
  首页: / || icon-home || faa-tada
  文章 || icon--article || faa-tada || hide:
    归档: /archives/ || icon-guidang1 || faa-tada
    文章统计: /tags/ || icon-shujutongji1 || faa-tada
    随便逛逛: javascript:randomPost(); || icon-zuji1 || faa-tada
  八宝箱 || icon-xiangzi || faa-tada || hide:
    八音盒: /life/music/ || icon-yinle || faa-tada
    画廊: /box/gallery/ || icon-tubiaozhizuomoban || faa-tada
    天文馆: /box/astronomy/ || icon-wangyuanjing || faa-tada
    网址导航: /box/nav/ || icon-zhifengche || faa-tada
  社交 || icon-shejiaoxinxi || faa-tada || hide:
    朋友圈: /social/fcircle/ || icon-pengyouquan || faa-tada
    留言板: /comments/ || icon-liuyan || faa-tada
    友人帐: /social/link/ || icon-lianjie || faa-tada
  网站 || icon-wangye || faa-tada || hide:
    网站统计: /site/census/ || icon--tongjibiao || faa-tada
    旧时光: /site/time/ || icon-xianxingshalou || faa-tada
    关于: /personal/about/ || icon-paperplane || faa-tada

# Code Blocks (代碼相關)
# --------------------------------------

highlight_theme: mac #  darker / pale night / light / ocean / mac / mac light / false
highlight_copy: true # copy button
highlight_lang: true # show the code language
highlight_shrink: false # true: shrink the code blocks / false: expand the code blocks | none: expand code blocks and hide the button
highlight_height_limit: 230 # unit: px
code_word_wrap: false

# copy settings
# copyright: Add the copyright information after copied content (複製的內容後面加上版權信息)
copy:
  enable: true
  copyright:
    enable: false
    limit_count: 50

# social settings (社交圖標設置)
# formal:
#   icon: link || the description
social:
  # 格式： 名称: 链接 || 图标类名 || 动画类名
  Github: https://github.com/yourname || icon-github || faa-tada
  B站: https://space.bilibili.com/12345678 || icon-bilibili || faa-tada
  邮箱: mailto:you@example.com || icon-youxiang || faa-tada
  # 微信: /assets/wechat-qr.webp || icon-weixin || faa-tada
  # RSS: /atom.xml || icon-RSS || faa-tada

  # 用 iconfont 图标的写法：
  # iconfont icon-github: https://github.com/yourname || Github
  # iconfont icon-youjian: mailto:you@example.com || 邮箱

  # iconfont icon-github: https://github.com/yourname || Github
  # iconfont icon-youjian: mailto:you@example.com || 邮箱
  # iconfont icon-tv: https://space.bilibili.com/12345678 || B站
  # iconfont icon-leetcode: https://leetcode.cn/u/yourname/ || 力扣
  # iconfont icon-weibo: https://weibo.com/u/0000000000 || 微博
  # iconfont icon-shejiaotubiao-46: https://www.zhihu.com/people/yourname || 知乎

# search (搜索)
# see https://butterfly.js.org/posts/ceeb73f/#搜索系統
# --------------------------------------

# Algolia search
algolia_search:
  enable: true
  hits:
    per_page: 5
  labels:
    input_placeholder: Search for Posts
    hits_empty: "我们没有找到任何搜索结果: ${query}"
    hits_stats: "找到${hits}条结果（用时${time} ms）"

# Local search
local_search:
  enable: false
  preload: true
  CDN:

# Math (數學)
# --------------------------------------
# About the per_page
# if you set it to true, it will load mathjax/katex script in each page (true 表示每一頁都加載js)
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' in page's front-matter)
# (false 需要時加載，須在使用的 Markdown Front-matter 加上 mathjax: true)

# katex:
#   enable: true # true 表示每一页都加载katex.js # false 需要时加载，须在使用的Markdown Front-matter 加上katex: true
#   per_page: false
#   hide_scrollbar: true

mathjax:
  enable: true
  per_page: false
  # 注意：theme.mathjax.cdn 是旧版遗留字段，Butterfly 主题实际读取 CDN.option.mathjax（见本文件末尾 CDN 段）
  # cdn: https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML

# Image (圖片設置)
# --------------------------------------

# Favicon（網站圖標）
favicon:

# Avatar (頭像)
avatar:
  img: /assets/avatar.webp
  effect: false

# Disable all banner image
disable_top_img: false

# The banner image of home page
index_img:

# If the banner of page not setting, it will show the top_img
default_top_img:

# The banner image of archive page
archive_img:

# If the banner of tag page not setting, it will show the top_img
# note: tag page, not tags page (子標籤頁面的 top_img)
tag_img: false

# The banner image of tag page
# format:
#  - tag name: xxxxx
tag_per_img:

# If the banner of category page not setting, it will show the top_img
# note: category page, not categories page (子分類頁面的 top_img)
category_img:

# The banner image of category page
# format:
#  - category name: xxxxx
category_per_img:

cover:
  # display the cover or not (是否顯示文章封面)
  index_enable: true
  aside_enable: true
  archives_enable: true
  # the position of cover in home page (封面顯示的位置)
  # left/right/both
  position: both
  # When cover is not set, the default cover is displayed (當沒有設置cover時，默認的封面顯示)
  default_cover:
    - https://picsum.photos/id/1036/1200/675
